[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jrsp"
version = "1.0.0"
description = "Reference implementation of a claim-structure-driven hierarchical model for predicting judicial support rates in traffic accident compensation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.12.0",
    "scikit-learn==1.6.1",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
# Interpretation and resampling extras.
analysis = ["shap==0.51.0"]
# Test extras.
test = ["pytest==7.4.4"]
# The prior-data fitted network expert. Requires model weights downloaded on first
# use; the weights are not distributed with this repository.
external = ["tabpfn==2.1.4"]

[project.urls]
Repository = "https://github.com/liyuan112531/traffic-accident-support-rate-prediction"
Issues = "https://github.com/liyuan112531/traffic-accident-support-rate-prediction/issues"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "src",
    "src.utils",
    "src.preprocessing",
    "src.features",
    "src.experts",
    "src.meta_learning",
    "src.aggregation",
    "src.evaluation",
    "src.statistics",
    "src.interpretation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The end-to-end test trains the expert pool once per fold and therefore takes
# minutes rather than seconds. It is tagged rather than deselected, so it is visible
# in the default run instead of silently skipped.
markers = [
    "slow: end-to-end execution of the full pipeline",
]
